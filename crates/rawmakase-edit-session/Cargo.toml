[package]
name = "rawmakase-edit-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The edit of the photo open in Develop, apart from any window: its History and save state"
license.workspace = true
repository = "https://github.com/pch/rawmakase"

# The helpers the app's tests set an edit up and step through History with.
[features]
test-support = []

[dependencies]
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
# Preset names for History steps.
rawmakase-interop = { path = "../rawmakase-interop", version = "0.1.0" }

[lints]
workspace = true
