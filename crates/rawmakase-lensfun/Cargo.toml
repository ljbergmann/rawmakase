[package]
name = "rawmakase-lensfun"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Installing, updating and removing Lensfun's lens database, apart from any window"
license.workspace = true
repository = "https://github.com/pch/rawmakase"

[dependencies]
rawmakase-model = { path = "../rawmakase-model", version = "0.1.0" }
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
ureq.workspace = true
# Lensfun's database comes as a .tar.bz2: both read in pure Rust, no libbz2; tar
# without extended attributes, nothing is unpacked to disk by it.
bzip2-rs = "0.1"
tar = { version = "0.4", default-features = false }

[lints]
workspace = true
